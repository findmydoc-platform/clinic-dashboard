version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "08:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
        update-types:
          - patch
          - minor
      storybook:
        patterns:
          - "@storybook/*"
          - storybook
        update-types:
          - patch
          - minor
      test-tooling:
        dependency-type: development
        patterns:
          - "@playwright/*"
          - playwright
          - "@vitest/*"
          - vitest
        update-types:
          - patch
          - minor
      production:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /.github
    schedule:
      interval: weekly
      day: thursday
      time: "08:00"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
