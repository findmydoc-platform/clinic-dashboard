name: Bug report
description: Report a reproducible product or technical defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what is broken and why it matters.
      placeholder: What happened, and what should have happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List the smallest reliable reproduction steps.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the deployment, browser, device, or commit where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, or links. Remove secrets and personal data.
