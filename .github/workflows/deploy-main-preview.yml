name: Deploy Main Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  VERCEL_CLI_VERSION: 56.0.0
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1
  STABLE_PREVIEW_DOMAIN: clinics.preview.findmydoc.eu
  VERCEL_SCOPE: findmydoc

jobs:
  scope:
    name: Main Preview scope
    if: vars.VERCEL_DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        # actionlint 1.7.12 does not yet support the self-repository prefix.
        uses: ./.github/actions/change-scope # zizmor: ignore[self-repository]

  deployment-disabled:
    name: Main preview disabled
    if: vars.VERCEL_DEPLOYMENTS_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled state
        run: echo "Main Preview deployments are disabled by repository policy."

  main-guard:
    name: Require main
    if: vars.VERCEL_DEPLOYMENTS_ENABLED == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Stop deployment
        run: exit 1

  deploy-main-preview:
    name: Vercel Main Preview
    needs: scope
    concurrency:
      group: main-preview-deploy
      cancel-in-progress: false
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.preview != 'false') &&
      vars.VERCEL_DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A queued deployment must not restore an older main revision.
          ref: main
          persist-credentials: false

      - name: Resolve main preview deployment metadata
        id: deployment_metadata
        run: |
          set -euo pipefail
          deployment_commit_sha="$(git rev-parse HEAD)"
          [[ "$deployment_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$deployment_commit_sha" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview settings
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --git-branch=main --token="$VERCEL_TOKEN"

      - name: Validate pulled Preview deployment metadata
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
        run: bash ./.github/scripts/validate-preview-deployment-metadata.sh

      - name: Build Vercel main preview
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
        run: bash ./.github/scripts/deploy/vercel-build.sh preview

      - name: Deploy verified main preview
        id: deploy
        run: |
          deployment_url="$(bash ./.github/scripts/deploy/vercel-deploy.sh preview)"

          if ! deployment_json="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" inspect "$deployment_url" --format=json --token="$VERCEL_TOKEN")"; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" remove "$deployment_url" --yes --token="$VERCEL_TOKEN" || true
            echo "::error::Unable to verify the Vercel deployment target; deployment removed."
            exit 1
          fi

          deployment_target="$(jq -r '.target' <<< "$deployment_json")"
          deployment_id="$(jq -r '.id' <<< "$deployment_json")"
          if [[ "$deployment_target" != "preview" || -z "$deployment_id" || "$deployment_id" == "null" ]]; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" remove "$deployment_url" --yes --token="$VERCEL_TOKEN" || true
            echo "::error::Expected a verified Vercel Preview deployment; deployment removed."
            exit 1
          fi

          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview

      - name: Point stable domain to main preview
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          pnpm dlx "vercel@${VERCEL_CLI_VERSION}" alias set "$DEPLOYMENT_URL" "$STABLE_PREVIEW_DOMAIN" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

          if ! alias_json="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" inspect "https://${STABLE_PREVIEW_DOMAIN}" --format=json --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"; then
            echo "::error::Unable to verify the stable Preview alias."
            exit 1
          fi

          alias_deployment_id="$(jq -r '.id' <<< "$alias_json")"
          if [[ "$alias_deployment_id" != "$DEPLOYMENT_ID" ]]; then
            echo "::error::Stable Preview alias does not resolve to the deployment created by this run."
            exit 1
          fi

          {
            echo "### Vercel Main Preview"
            echo "Stable: https://${STABLE_PREVIEW_DOMAIN}"
            echo "Deployment: ${DEPLOYMENT_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
