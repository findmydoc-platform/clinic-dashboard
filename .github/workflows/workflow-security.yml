name: Workflow Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        # actionlint 1.7.12 does not yet support the self-repository prefix.
        uses: ./.github/actions/change-scope # zizmor: ignore[self-repository]

      - name: Workflow lint
        if: steps.scope.outputs.workflow_security != 'false'
        uses: reviewdog/action-actionlint@419a49378266e892f40c773b4f2fc6de9aa87499 # v1.80.4
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: Workflow security audit
        if: steps.scope.outputs.workflow_security != 'false'
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: "false"
          annotations: "true"
          persona: regular

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-secret-scan.txt

      - name: Install secret scanner
        run: python -m pip install --requirement .github/requirements-secret-scan.txt

      - name: Detect secrets in selected files
        env:
          SCOPE_MANIFEST: ${{ steps.scope.outputs.manifest }}
        run: node scripts/ci/scan-secrets.mjs "$SCOPE_MANIFEST"
