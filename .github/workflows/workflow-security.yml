name: Workflow Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "50 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    name: Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: scope
        # actionlint 1.7.12 does not yet support the self-repository prefix.
        uses: ./.github/actions/change-scope # zizmor: ignore[self-repository]

      - name: Workflow lint
        if: steps.scope.outputs.workflow_security != 'false'
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error

      - name: Workflow security audit
        if: steps.scope.outputs.workflow_security != 'false'
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: "false"
          annotations: "true"
          persona: regular

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-secret-scan.txt

      - name: Install secret scanner
        run: python -m pip install --requirement .github/requirements-secret-scan.txt

      - name: Detect secrets in selected files
        env:
          SCOPE_MANIFEST: ${{ steps.scope.outputs.manifest }}
        run: node scripts/ci/scan-secrets.mjs "$SCOPE_MANIFEST"
