name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  VERCEL_CLI_VERSION: 56.0.0
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  deployment-disabled:
    name: Production disabled
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled state
        run: echo "Production deployments are disabled by repository policy."

  main-guard:
    name: Require main
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Stop deployment
        run: exit 1

  deploy-production:
    name: Vercel Production
    if: vars.VERCEL_PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Static checks
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test all layers
        run: pnpm test:all

      - name: Build application
        run: pnpm build

      - name: Pull Vercel production settings
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --git-branch=main --token="$VERCEL_TOKEN"

      - name: Build Vercel production
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod

      - name: Deploy Vercel production
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
