name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "20 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CodeQL scope
    if: vars.CODEQL_ADVANCED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      javascript: ${{ steps.scope.outputs.codeql_js }}
      actions: ${{ steps.scope.outputs.codeql_actions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        # actionlint 1.7.12 does not yet support the self-repository prefix.
        uses: ./.github/actions/change-scope # zizmor: ignore[self-repository]

  javascript:
    name: Analyze (javascript-typescript)
    needs: scope
    if: >-
      !cancelled() && vars.CODEQL_ADVANCED_ENABLED == 'true' &&
      (needs.scope.result != 'success' || needs.scope.outputs.javascript != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:javascript-typescript

  actions:
    name: Analyze (actions)
    needs: scope
    if: >-
      !cancelled() && vars.CODEQL_ADVANCED_ENABLED == 'true' &&
      (needs.scope.result != 'success' || needs.scope.outputs.actions != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:actions
