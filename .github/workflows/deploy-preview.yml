name: Deploy Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.28.2
  VERCEL_CLI_VERSION: 56.0.0
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1

jobs:
  scope:
    name: Preview scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scope
        # actionlint 1.7.12 does not yet support the self-repository prefix.
        uses: ./.github/actions/change-scope # zizmor: ignore[self-repository]

  deploy-preview:
    name: Vercel Preview
    needs: scope
    permissions:
      contents: read
      pull-requests: write
    if: >-
      !cancelled() &&
      (needs.scope.result != 'success' || needs.scope.outputs.preview != 'false') &&
      vars.VERCEL_DEPLOYMENTS_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve preview deployment metadata
        id: deployment_metadata
        run: |
          set -euo pipefail
          deployment_commit_sha="$(git rev-parse HEAD)"
          [[ "$deployment_commit_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "commit_sha=$deployment_commit_sha" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel preview settings
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=preview --git-branch="${GITHUB_HEAD_REF}" --token="$VERCEL_TOKEN"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Validate pulled Preview deployment metadata
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
        run: bash ./.github/scripts/validate-preview-deployment-metadata.sh

      - name: Build Vercel preview
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
        run: bash ./.github/scripts/deploy/vercel-build.sh preview

      - name: Deploy Vercel preview
        id: deploy
        run: |
          deployment_url="$(bash ./.github/scripts/deploy/vercel-deploy.sh preview)"

          if ! deployment_json="$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" inspect "$deployment_url" --format=json --token="$VERCEL_TOKEN")"; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" remove "$deployment_url" --yes --token="$VERCEL_TOKEN" || true
            echo "::error::Unable to verify the Vercel deployment target; deployment removed."
            exit 1
          fi

          deployment_target="$(jq -r '.target' <<< "$deployment_json")"
          if [[ "$deployment_target" != "preview" ]]; then
            pnpm dlx "vercel@${VERCEL_CLI_VERSION}" remove "$deployment_url" --yes --token="$VERCEL_TOKEN" || true
            echo "::error::Expected a Vercel preview deployment, received '$deployment_target'; deployment removed."
            exit 1
          fi

          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "[$deployment_url]($deployment_url)" >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
          DEPLOYMENT_ENVIRONMENT: preview
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Publish preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_COMMIT_SHA: ${{ steps.deployment_metadata.outputs.commit_sha }}
        run: node scripts/ci/preview-comment.mjs publish

  stale-preview:
    name: Mark outdated Preview link
    needs: scope
    if: >-
      !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.preview == 'false' &&
      vars.VERCEL_DEPLOYMENTS_ENABLED == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Mark previous Preview links as outdated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/preview-comment.mjs stale
